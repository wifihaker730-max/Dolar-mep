<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel - Dólar MEP</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* VARIABLES DE TEMA OSCURO (POR DEFECTO) */
    :root {
      --bg-body: #0b1329;
      --card-bg: #152238;
      --card-border: #1e2d4a;
      --subcard-bg: #0d182e;
      --text-main: #ffffff;
      --text-muted: #8b9bb4;
      --blue-accent: #3b82f6;
      --green-accent: #22c55e;
      --red-accent: #ef4444;
      --orange-accent: #f97316;
      --badge-bg: rgba(234, 179, 8, 0.15);
      --badge-text: #eab308;
      --dot-color: #eab308;
      --dot-glow: rgba(234, 179, 8, 0.6);
    }

    /* VARIABLES DE TEMA CLARO */
    [data-theme="light"] {
      --bg-body: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --subcard-bg: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --blue-accent: #2563eb;
      --green-accent: #16a34a;
      --red-accent: #dc2626;
      --orange-accent: #ea580c;
      --badge-bg: #fef9c3;
      --badge-text: #854d0e;
      --dot-color: #ca8a04;
      --dot-glow: rgba(202, 138, 4, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.25s, color 0.25s, border-color 0.25s;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ENCABEZADO */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 16px 20px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* BADGE E INDICADOR LED MEJORADO */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
    }

    /* LED CON ANIMACIÓN DE PULSO */
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: var(--dot-color);
      position: relative;
      box-shadow: 0 0 6px var(--dot-color);
      animation: ledPulse 1.8s infinite ease-in-out;
    }

    @keyframes ledPulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 2px var(--dot-color), 0 0 0 0 var(--dot-glow);
      }
      50% {
        transform: scale(1.15);
        box-shadow: 0 0 8px var(--dot-color), 0 0 0 6px rgba(0, 0, 0, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 2px var(--dot-color), 0 0 0 0 rgba(0, 0, 0, 0);
      }
    }

    /* BOTÓN CAMBIO DE TEMA */
    .theme-toggle-btn {
      background: var(--subcard-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* TARJETAS PRINCIPALES */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .card-price {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .card-footer-text {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* VARIACIONES */
    .variation-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }

    .subcard {
      background-color: var(--subcard-bg);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .val-negative {
      color: var(--red-accent);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .val-positive {
      color: var(--green-accent);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .val-neutral {
      color: var(--text-muted);
      font-weight: 700;
      font-size: 1.1rem;
    }

    /* GRÁFICO */
    .chart-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 220px;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- CABECERA -->
    <header>
      <div class="header-top">
        <h1>Panel – Dólar MEP</h1>
        <div style="display: flex; align-items: center; gap: 10px;">
          <div class="badge">
            <span class="status-dot" id="statusDot"></span> 
            <span id="statusText">Cargando...</span>
          </div>
          <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">
            🌙 Oscuro
          </button>
        </div>
      </div>
    </header>

    <!-- COMPRA -->
    <div class="card">
      <span class="card-label">DÓLAR MEP COMPRA</span>
      <span class="card-price" id="mepCompra">$ --</span>
      <span class="card-footer-text" id="fechaCompra">Fecha: --</span>
    </div>

    <!-- VENTA -->
    <div class="card">
      <span class="card-label">DÓLAR MEP VENTA</span>
      <span class="card-price" id="mepVenta">$ --</span>
      <span class="card-footer-text" id="fechaVenta">Fecha: --</span>
    </div>

    <!-- SPREAD / BRECHA -->
    <div class="card">
      <span class="card-label">SPREAD / BRECHA EN PESOS</span>
      <span class="card-price" id="mepSpread" style="color: var(--blue-accent);">$ --</span>
      <span class="card-footer-text">Diferencia neta entre venta y compra</span>
    </div>

    <!-- VARIACIÓN DEL DÍA -->
    <div class="card">
      <span class="card-label">VARIACIÓN DEL DÍA (VS DÍA ANTERIOR)</span>
      <div class="variation-grid">
        <div class="subcard">
          <span class="card-label">VAR. COMPRA</span>
          <span id="varCompra" class="val-neutral">$ 0.00</span>
        </div>
        <div class="subcard">
          <span class="card-label">VAR. VENTA</span>
          <span id="varVenta" class="val-neutral">$ 0.00</span>
        </div>
      </div>
    </div>

    <!-- EVOLUCIÓN HISTÓRICA -->
    <div class="chart-card">
      <span class="card-label">EVOLUCIÓN HISTÓRICA (TOCAR PARA VER PRECIO)</span>
      <div class="chart-container">
        <canvas id="historyChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    // ID de tu planilla de Google Sheets
    const SHEET_ID = '1WkHlfGAjluwEBDzw2PkGqdvVmT5vD7rcY-5RJXfJLeE';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

    document.body.setAttribute('data-theme', 'light');

    function toggleTheme() {
      const currentTheme = document.body.getAttribute('data-theme');
      const btn = document.getElementById('themeBtn');

      if (currentTheme === 'light') {
        document.body.removeAttribute('data-theme');
        btn.innerHTML = '☀️ Claro';
        updateChartColors(false);
      } else {
        document.body.setAttribute('data-theme', 'light');
        btn.innerHTML = '🌙 Oscuro';
        updateChartColors(true);
      }
    }

    // Parsea números argentinos tipo "1.537,60" o "1537.60"
    function parseMontoAR(val) {
      if (!val) return 0;
      let s = val.toString().trim().replace(/"/g, '');
      if (s.includes(',') && s.includes('.')) {
        s = s.replace(/\./g, '').replace(',', '.');
      } else if (s.includes(',')) {
        s = s.replace(',', '.');
      }
      return parseFloat(s) || 0;
    }

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result;
    }

    function formatNumber(num) {
      return num.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    let chart = null;

    async function loadDataFromSheets() {
      try {
        const response = await fetch(CSV_URL);
        const dataText = await response.text();
        
        const lines = dataText.split(/\r?\n/).filter(l => l.trim() !== "");
        const rows = lines.map(parseCSVLine);
        
        // Filtrar filas vacías o con títulos
        const cleanRows = rows.slice(1).filter(r => r.length >= 3 && r[0] !== "" && r[1] !== "" && r[1] !== "-");

        if (cleanRows.length === 0) return;

        const dates = cleanRows.map(r => r[0].replace(/"/g, ''));
        const compras = cleanRows.map(r => parseMontoAR(r[1]));
        const ventas = cleanRows.map(r => parseMontoAR(r[2]));

        const lastIdx = cleanRows.length - 1;
        const prevIdx = lastIdx > 0 ? lastIdx - 1 : lastIdx;

        const lastDate = dates[lastIdx];
        const lastCompra = compras[lastIdx];
        const lastVenta = ventas[lastIdx];

        const prevCompra = compras[prevIdx];
        const prevVenta = ventas[prevIdx];

        const spread = lastVenta - lastCompra;
        const diffCompra = lastCompra - prevCompra;
        const diffVenta = lastVenta - prevVenta;

        // 1. Actualizar Tarjetas Principales
        document.getElementById('mepCompra').innerText = `$ ${formatNumber(lastCompra)}`;
        document.getElementById('mepVenta').innerText = `$ ${formatNumber(lastVenta)}`;
        document.getElementById('fechaCompra').innerText = `Fecha: ${lastDate}`;
        document.getElementById('fechaVenta').innerText = `Fecha: ${lastDate}`;
        document.getElementById('mepSpread').innerText = `$ ${formatNumber(spread)}`;

        // 2. Actualizar Variación
        const elVarCompra = document.getElementById('varCompra');
        const elVarVenta = document.getElementById('varVenta');

        if (diffCompra > 0) {
          elVarCompra.className = 'val-positive';
          elVarCompra.innerText = `+ $ ${formatNumber(diffCompra)}`;
        } else if (diffCompra < 0) {
          elVarCompra.className = 'val-negative';
          elVarCompra.innerText = `- $ ${formatNumber(Math.abs(diffCompra))}`;
        } else {
          elVarCompra.className = 'val-neutral';
          elVarCompra.innerText = `$ 0.00`;
        }

        if (diffVenta > 0) {
          elVarVenta.className = 'val-positive';
          elVarVenta.innerText = `+ $ ${formatNumber(diffVenta)}`;
        } else if (diffVenta < 0) {
          elVarVenta.className = 'val-negative';
          elVarVenta.innerText = `- $ ${formatNumber(Math.abs(diffVenta))}`;
        } else {
          elVarVenta.className = 'val-neutral';
          elVarVenta.innerText = `$ 0.00`;
        }

        // 3. Estado del Mercado y LED
        const todayStr = new Date().toLocaleDateString('es-AR');
        const isToday = (lastDate === todayStr);
        
        // Evaluar horario de mercado (de 11:00 a 17:00 hs)
        const now = new Date();
        const currentHour = now.getHours();
        const isMarketHours = (currentHour >= 11 && currentHour < 17);

        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');

        if (isToday && isMarketHours) {
          statusText.innerText = 'Mercado abierto';
          document.documentElement.style.setProperty('--dot-color', '#22c55e');
          document.documentElement.style.setProperty('--dot-glow', 'rgba(34, 197, 94, 0.6)');
        } else {
          statusText.innerText = 'Mercado cerrado';
          document.documentElement.style.setProperty('--dot-color', '#eab308');
          document.documentElement.style.setProperty('--dot-glow', 'rgba(234, 179, 8, 0.6)');
        }

        // 4. Renderizar Gráfico con los últimos 12 datos
        renderChart(dates.slice(-12), compras.slice(-12), ventas.slice(-12));

      } catch (err) {
        console.error("Error al obtener los datos de la planilla:", err);
        document.getElementById('statusText').innerText = 'Desconectado';
        document.documentElement.style.setProperty('--dot-color', '#ef4444');
        document.documentElement.style.setProperty('--dot-glow', 'rgba(239, 68, 68, 0.6)');
      }
    }

    function renderChart(labels, dataCompra, dataVenta) {
      const ctx = document.getElementById('historyChart').getContext('2d');
      const isLight = document.body.getAttribute('data-theme') === 'light';

      const minVal = Math.floor(Math.min(...dataCompra, ...dataVenta) - 2);
      const maxVal = Math.ceil(Math.max(...dataCompra, ...dataVenta) + 2);

      if (chart) {
        chart.destroy();
      }

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Dólar Compra',
              data: dataCompra,
              borderColor: '#2563eb',
              backgroundColor: 'rgba(37, 99, 235, 0.15)',
              fill: true,
              tension: 0.3,
              pointRadius: 4,
              pointBackgroundColor: '#2563eb'
            },
            {
              label: 'Dólar Venta',
              data: dataVenta,
              borderColor: '#ea580c',
              backgroundColor: 'rgba(234, 88, 12, 0.15)',
              fill: true,
              tension: 0.3,
              pointRadius: 4,
              pointBackgroundColor: '#ea580c'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              labels: {
                color: isLight ? '#64748b' : '#8b9bb4',
                font: { size: 11, weight: 'bold' },
                boxWidth: 12
              }
            }
          },
          scales: {
            x: {
              ticks: {
                color: isLight ? '#64748b' : '#8b9bb4',
                font: { size: 9 },
                maxRotation: 45,
                minRotation: 45
              },
              grid: { display: false }
            },
            y: {
              min: minVal,
              max: maxVal,
              ticks: {
                color: isLight ? '#64748b' : '#8b9bb4',
                font: { size: 10 },
                stepSize: 2,
                callback: function(value) { return '$ ' + value; }
              },
              grid: {
                color: isLight ? 'rgba(0, 0, 0, 0.05)' : 'rgba(255, 255, 255, 0.05)'
              }
            }
          }
        }
      });
    }

    function updateChartColors(isLight) {
      if (!chart) return;
      const textColor = isLight ? '#64748b' : '#8b9bb4';
      const gridColor = isLight ? 'rgba(0, 0, 0, 0.05)' : 'rgba(255, 255, 255, 0.05)';

      chart.options.plugins.legend.labels.color = textColor;
      chart.options.scales.x.ticks.color = textColor;
      chart.options.scales.y.ticks.color = textColor;
      chart.options.scales.y.grid.color = gridColor;
      chart.update();
    }

    // Ejecutar al cargar la página y consultar cambios cada 1 minuto
    loadDataFromSheets();
    setInterval(loadDataFromSheets, 60000);
  </script>
</body>
</html>
