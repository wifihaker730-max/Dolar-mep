<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel - Dólar MEP</title>
  <!-- Chart.js para gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-card {
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f8fafc;
    }

    /* Indicador de Estado Titilante */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.5; }
    }

    /* 🟢 VERDE */
    .badge-green { background-color: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .dot-green { background-color: #22c55e; box-shadow: 0 0 10px #22c55e; animation: pulse 1.6s infinite ease-in-out; }

    /* 🟡 AMARILLO */
    .badge-yellow { background-color: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
    .dot-yellow { background-color: #eab308; box-shadow: 0 0 10px #eab308; animation: pulse 1.6s infinite ease-in-out; }

    /* 🔴 ROJO */
    .badge-red { background-color: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .dot-red { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; animation: pulse 1.6s infinite ease-in-out; }

    .label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.6px;
    }

    .value {
      font-size: 1.9rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .subtext {
      font-size: 0.8rem;
      color: #64748b;
    }

    /* Estadísticas en Pesos del Día */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 6px;
    }

    .stat-box {
      background: #0f172a;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #1e293b;
    }

    .stat-val {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .up { color: #4ade80; }
    .down { color: #f87171; }
    .neutral { color: #94a3b8; }

    .chart-container {
      position: relative;
      height: 240px;
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <div class="card header-card">
    <div class="title">Panel – Dólar MEP</div>
    <div id="statusBadge" class="status-badge badge-yellow">
      <span id="statusDot" class="dot dot-yellow"></span>
      <span id="statusText">Cargando...</span>
    </div>
  </div>

  <!-- COTIZACIONES COMPRA Y VENTA -->
  <div class="card">
    <div class="label">Dólar MEP Compra</div>
    <div id="valCompra" class="value">$ --,--</div>
    <div id="fechaCompra" class="subtext">Fecha: --/--/----</div>
  </div>

  <div class="card">
    <div class="label">Dólar MEP Venta</div>
    <div id="valVenta" class="value">$ --,--</div>
    <div id="fechaVenta" class="subtext">Fecha: --/--/----</div>
  </div>

  <!-- SPREAD / BRECHA CORREGIDA -->
  <div class="card">
    <div class="label">Spread / Brecha en Pesos</div>
    <div id="valSpread" class="value" style="color: #60a5fa;">$ --,--</div>
    <div class="subtext">Diferencia neta entre compra y venta</div>
  </div>

  <!-- ESTADÍSTICAS DEL DÍA EN PESOS -->
  <div class="card">
    <div class="label">Variación del Día (vs Ayer)</div>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="label">Var. Compra</div>
        <div id="varCompra" class="stat-val neutral">$ 0,00</div>
      </div>
      <div class="stat-box">
        <div class="label">Var. Venta</div>
        <div id="varVenta" class="stat-val neutral">$ 0,00</div>
      </div>
    </div>
  </div>

  <!-- GRÁFICO MODERNO -->
  <div class="card">
    <div class="label">Evolución Reciente</div>
    <div class="chart-container">
      <canvas id="meChart"></canvas>
    </div>
  </div>

  <script>
    const SHEET_ID = '1WkHlfGAjluwEBDzw2PkGqdvVmT5vD7rcY-5RJXfJLeE';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

    let myChart = null;

    // Limpieza de datos importados desde el CSV
    function parseMoneyValue(valStr) {
      if (!valStr) return 0;
      let clean = valStr.toString().replace(/"/g, '').replace(/\$/g, '').trim();
      
      if (clean.includes(',') && clean.includes('.')) {
        clean = clean.replace(/\./g, '').replace(',', '.');
      } else if (clean.includes(',')) {
        clean = clean.replace(',', '.');
      }
      return parseFloat(clean) || 0;
    }

    function formatMoney(num) {
      return '$ ' + num.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    async function loadData() {
      try {
        const response = await fetch(CSV_URL + '&t=' + new Date().getTime());
        const text = await response.text();
        const lines = text.trim().split('\n').filter(l => l.trim() !== '');

        if (lines.length <= 1) return;

        const dataRows = [];
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
          if (cols && cols.length >= 3) {
            const fecha = cols[0].replace(/"/g, '').trim();
            const compra = parseMoneyValue(cols[1]);
            const venta = parseMoneyValue(cols[2]);
            if (compra > 0 && venta > 0) {
              dataRows.push({ fecha, compra, venta });
            }
          }
        }

        if (dataRows.length === 0) return;

        const latest = dataRows[dataRows.length - 1];
        const prev = dataRows.length > 1 ? dataRows[dataRows.length - 2] : latest;

        // Spread (Venta - Compra)
        const spread = latest.venta - latest.compra;

        // Variaciones diarias
        const diffCompra = latest.compra - prev.compra;
        const diffVenta = latest.venta - prev.venta;

        document.getElementById('valCompra').innerText = formatMoney(latest.compra);
        document.getElementById('fechaCompra').innerText = `Fecha: ${latest.fecha}`;

        document.getElementById('valVenta').innerText = formatMoney(latest.venta);
        document.getElementById('fechaVenta').innerText = `Fecha: ${latest.fecha}`;

        document.getElementById('valSpread').innerText = formatMoney(spread);

        renderStat('varCompra', diffCompra);
        renderStat('varVenta', diffVenta);

        updateSystemStatus(latest.fecha);
        renderChart(dataRows.slice(-10));

      } catch (err) {
        console.error('Error al procesar datos:', err);
        setBadges('badge-red', 'dot-red', 'Sin conexión');
      }
    }

    function renderStat(elemId, diff) {
      const el = document.getElementById(elemId);
      const sign = diff > 0 ? '+ ' : (diff < 0 ? '- ' : '');
      const absVal = Math.abs(diff);

      el.innerText = `${sign}$ ${absVal.toFixed(2)}`;
      if (diff > 0) {
        el.className = 'stat-val up';
      } else if (diff < 0) {
        el.className = 'stat-val down';
      } else {
        el.className = 'stat-val neutral';
      }
    }

    function updateSystemStatus(latestDateStr) {
      const now = new Date();
      const todayStr = now.toLocaleDateString('es-AR');
      const currentHour = now.getHours();
      const dayOfWeek = now.getDay();

      const isToday = (latestDateStr === todayStr);
      const isMarketHours = (currentHour >= 11 && currentHour < 17);
      const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

      if (isToday && isMarketHours && !isWeekend) {
        setBadges('badge-green', 'dot-green', 'En vivo');
      } else if (isToday || isWeekend || !isMarketHours) {
        setBadges('badge-yellow', 'dot-yellow', 'Mercado cerrado');
      } else {
        setBadges('badge-red', 'dot-red', 'Desactivado');
      }
    }

    function setBadges(badgeClass, dotClass, text) {
      const badge = document.getElementById('statusBadge');
      const dot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      badge.className = `status-badge ${badgeClass}`;
      dot.className = `dot ${dotClass}`;
      statusText.innerText = text;
    }

    function renderChart(data) {
      const labels = data.map(d => d.fecha);
      const compras = data.map(d => d.compra);
      const ventas = data.map(d => d.venta);

      const ctx = document.getElementById('meChart').getContext('2d');

      const gradCompra = ctx.createLinearGradient(0, 0, 0, 200);
      gradCompra.addColorStop(0, 'rgba(59, 130, 246, 0.4)');
      gradCompra.addColorStop(1, 'rgba(59, 130, 246, 0.0)');

      const gradVenta = ctx.createLinearGradient(0, 0, 0, 200);
      gradVenta.addColorStop(0, 'rgba(249, 115, 22, 0.4)');
      gradVenta.addColorStop(1, 'rgba(249, 115, 22, 0.0)');

      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Compra',
              data: compras,
              borderColor: '#60a5fa',
              backgroundColor: gradCompra,
              fill: true,
              tension: 0.4,
              borderWidth: 3,
              pointBackgroundColor: '#60a5fa',
              pointRadius: 4
            },
            {
              label: 'Venta',
              data: ventas,
              borderColor: '#f97316',
              backgroundColor: gradVenta,
              fill: true,
              tension: 0.4,
              borderWidth: 3,
              pointBackgroundColor: '#f97316',
              pointRadius: 4
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: { color: '#94a3b8', font: { weight: 'bold' } }
            }
          },
          scales: {
            x: {
              grid: { color: '#334155' },
              ticks: { color: '#94a3b8', maxRotation: 45 }
            },
            y: {
              grid: { color: '#334155' },
              ticks: {
                color: '#94a3b8',
                callback: function(val) { return '$' + val; }
              }
            }
          }
        }
      });
    }

    loadData();
    setInterval(loadData, 60000);
  </script>
</body>
</html>
