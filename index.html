<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Monitoreo - Dólar MEP</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #1a202c;
      --text-muted: #718096;
      --border-color: #e2e8f0;
      --primary-color: #3182ce;
      --accent-green: #2ec4b6;
      --accent-red: #e71d36;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --primary-color: #38bdf8;
      --shadow: 0 4px 12px rgba(0,0,0,0.25);
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.3s, color 0.3s;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
    }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .status-container {
      display: flex;
      align-items: center;
      font-weight: 600;
    }

    .dot {
      height: 12px;
      width: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }

    .dot.active {
      background-color: var(--accent-green);
      animation: pulse-green 1.5s infinite;
    }

    .dot.inactive {
      background-color: var(--accent-red);
      animation: pulse-red 1.5s infinite;
    }

    @keyframes pulse-green {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 196, 182, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(46, 196, 182, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 196, 182, 0); }
    }

    @keyframes pulse-red {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(231, 29, 54, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(231, 29, 54, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(231, 29, 54, 0); }
    }

    .view { display: none; }
    .view.active { display: block; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .card-value {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .calc-container {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      margin-top: 20px;
    }

    .calc-group {
      display: flex;
      gap: 15px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .calc-input {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
      width: 100%;
      max-width: 250px;
    }

    .chart-container {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="status-container">
        <span class="dot active" id="statusDot"></span>
        <span id="statusText">Cargando datos...</span>
      </div>

      <nav class="nav-tabs">
        <button class="tab-btn active" onclick="switchView('inicio', event)">🏠 Inicio</button>
        <button class="tab-btn" onclick="switchView('panel', event)">📊 Panel MEP</button>
      </nav>

      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Oscuro</button>
    </header>

    <!-- VISTA 1: INICIO -->
    <section id="view-inicio" class="view active">
      <div class="cards-grid">
        <div class="card">
          <div class="card-title">MEP Compra</div>
          <div class="card-value" id="mepCompraVal">--</div>
        </div>
        <div class="card">
          <div class="card-title">MEP Venta</div>
          <div class="card-value" id="mepVentaVal">--</div>
        </div>
        <div class="card">
          <div class="card-title">Brecha Compra/Venta</div>
          <div class="card-value" id="brechaVal">--</div>
        </div>
        <div class="card">
          <div class="card-title">Variación Diaria</div>
          <div class="card-value" id="variacionVal">--</div>
        </div>
      </div>

      <!-- Calculadora de Conversión -->
      <div class="calc-container">
        <h3>🧮 Calculadora Rápida</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Ingresá el monto en pesos para calcular el equivalente en Dólar MEP Venta.</p>
        <div class="calc-group">
          <input type="number" id="pesosInput" class="calc-input" placeholder="Monto en ARS ($)" oninput="calcularMEP()">
          <div class="card" style="flex: 1; min-width: 200px; padding: 10px 20px;">
            <div class="card-title">Obtenés aproximadamente</div>
            <div class="card-value" id="dolaresResult" style="color: var(--primary-color);">$0,00 USD</div>
          </div>
        </div>
      </div>
    </section>

    <!-- VISTA 2: PANEL DE CONTROL -->
    <section id="view-panel" class="view">
      <div class="chart-container">
        <h3>📈 Histórico de Cotizaciones Dólar MEP</h3>
        <canvas id="mepChart"></canvas>
      </div>
    </section>
  </div>

  <script>
    // Pegá acá la URL del CSV publicado de tu Google Sheets o de tu API
    const SHEET_CSV_URL = 'URL_DE_TU_GOOGLE_SHEETS_AQUI';

    let mepVentaUltimo = 0;
    let mepChartInstance = null;

    // Cambiar Vistas
    function switchView(viewName, e) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(`view-${viewName}`).classList.add('active');
      if (e) e.target.classList.add('active');
    }

    // Modo Claro / Oscuro
    function toggleTheme() {
      const currentTheme = document.body.getAttribute('data-theme');
      const btn = document.getElementById('themeBtn');

      if (currentTheme === 'dark') {
        document.body.removeAttribute('data-theme');
        btn.innerText = '🌙 Oscuro';
      } else {
        document.body.setAttribute('data-theme', 'dark');
        btn.innerText = '☀️ Claro';
      }
    }

    // Calculadora
    function calcularMEP() {
      const pesos = parseFloat(document.getElementById('pesosInput').value);
      const res = document.getElementById('dolaresResult');

      if (!isNaN(pesos) && pesos > 0 && mepVentaUltimo > 0) {
        const total = (pesos / mepVentaUltimo).toFixed(2);
        res.innerText = `$${total} USD`;
      } else {
        res.innerText = '$0,00 USD';
      }
    }

    // Cargar Datos Automáticos desde Google Sheets / API
    async function cargarDatos() {
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      try {
        const response = await fetch('https://dolarapi.com/v1/dolares/bolsa');
        const data = await response.json();

        // Extraer valores reales
        const compra = data.compra;
        const venta = data.venta;
        mepVentaUltimo = venta;

        // Calcular Brecha entre compra y venta
        const brecha = (((venta - compra) / compra) * 100).toFixed(2);

        // Actualizar interfaz
        document.getElementById('mepCompraVal').innerText = `$${compra.toLocaleString('es-AR')}`;
        document.getElementById('mepVentaVal').innerText = `$${venta.toLocaleString('es-AR')}`;
        document.getElementById('brechaVal').innerText = `${brecha}%`;
        document.getElementById('variacionVal').innerText = `0.00%`;

        // Marcar estado "En vivo"
        statusDot.className = 'dot active';
        statusText.innerText = 'En vivo';

        // Renderizar Gráfico
        renderGrafico([compra], [venta], [new Date().toLocaleDateString()]);

      } catch (error) {
        console.error('Error al cargar datos:', error);
        statusDot.className = 'dot inactive';
        statusText.innerText = 'Desconectado';
      }
    }

    function renderGrafico(compras, ventas, fechas) {
      const ctx = document.getElementById('mepChart').getContext('2d');

      if (mepChartInstance) {
        mepChartInstance.destroy();
      }

      mepChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: fechas,
          datasets: [
            {
              label: 'MEP Compra',
              data: compras,
              borderColor: '#38bdf8',
              backgroundColor: 'rgba(56, 189, 248, 0.1)',
              tension: 0.3,
              fill: true
            },
            {
              label: 'MEP Venta',
              data: ventas,
              borderColor: '#f97316',
              backgroundColor: 'rgba(249, 115, 22, 0.1)',
              tension: 0.3,
              fill: true
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'top' }
          }
        }
      });
    }

    // Inicializar al cargar la página
    cargarDatos();
  </script>
</body>
</html>
